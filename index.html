<!DOCTYPE html>
<html lang="cz/cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <table border="1">
        <tr>
            
            <th colspan="4">
                <h1>Registration Form</h1>
            </th>
            
        </tr>
        <tr>
            <th>
                <p>Student name</p>
            </th>
            <th>
                <form><input type="text" name="student_name" value="First name"></form>
            </th>
            <th>
                <form><input type="text" name="middle_name" value="middle name"></form>
            </th>
            <th>
                <form><input type="text" name="last_name" value="last name"></form>
            </th>
        </tr>
        <tr>
            <th>
                <p>Fathers name</p>
            </th>
            <th>
                <form><input type="text" name="father_name" value="Fathers name"></form>
            </th>
            <th>
                <p>Mothers name</p>
            </th>
            <th>
                <form><input type="text" name="mother_name" value="mothers name"></form>
        </tr>
        <tr>
            <th>
                <p>Date of birth</p>
            </th>
            <th>
                <form><input type="date" name="dob"></form>
            </th>
            <th>
                <p>Gender</p>
            </th>
            <th>
                <form>
                    <input type="radio" name="gender" value="male">Male</input>
                    <input type="radio" name="gender" value="female">Female</input>
                </form>
            </th>
        </tr>
        <tr>
            <th>
                <p>Category</p>
            </th>
            <th>
                <form>
                    <input type="radio" name="category" value="general">General</input>
                    <input type="radio" name="category" value="obc">OBC</input>
                    <input type="radio" name="category" value="sc/st/">SC/ST</input>

                </form>
            </th>
            <th>
                <p>Handicapped</p>
            </th>
            <th>
                <form>
                    <input type="radio" name="handicapped" value="yes">Yes</input>
                    <input type="radio" name="handicapped" value="no">No
                </form>
            </th>
        </tr>
        <tr>
            <th>
                <p>Ex-serviceman</p>
            </th>
            <th>
                <form>
                    <input type="radio" name="ex_serviceman" value="yes">Yes</input>
                    <input type="radio" name="ex_serviceman" value="no">No
                </form>
            </th>
            <th>
                <p>EWS</p>
            </th>
            <th>
                <form>
                    <input type="radio" name="ews" value="yes">Yes</input>
                    <input type="radio" name="ews" value="no">No
                </form>
            </th>
        </tr>
        <tr>
            <th>
                <p>Email ID</p>
            </th>
            <th>
                <form><input type="email" name="email_id"></form>
            </th>
            <th>
                <p>Mobile No</p>
                </th>
            <th>
                <form><input type="tel" name="mobile_no"></form>
            </th>
        </tr>
        <tr>
            <th>
                <p>State</p>
            </th>
            <th>
                <form>
                    <select name="state">
                        <option value="">--Select any One--</option>
                        <option value="state1">Stat 1</option>
                        <option value="state2">Stat 2</option>
                        <option value="state3">Stat 3</option>
                    </select>
                </form>
            </th>
            <th>
                <p>City</p>
            </th>
            <th>
                <form>
                    <select name="city">
                        <option value="">--Select any One--</option>
                        <option value="city1">City 1</option>
                        <option value="city2">City 2</option>
                        <option value="city3">City 3</option>
                    </select>
                </form>
            </th>
        </tr>
        <tr>
            <th>
                <p>Upload photo</p>
            </th>
            <th>
                <form><input type="file" name="upload_photo"></form>
            </th>
            <th>
                <p>Upload signature</p>
            </th>
            <th>
                <form><input type="file" name="upload_signature"></form>
            </th>
        </tr>
        <tr>
            <th>

            </th>
            <th colspan="3">
                <form><input type="submit" value="Submit"></form>
            </th>
        </tr>
    </table>
</body>
</html>
